name: Release Nusa Wallet

on:
  push:
    tags:
      - 'v*' # Workflow akan berjalan otomatis setiap kali Anda membuat tag versi (contoh: v1.0.0)

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Memberi izin agar Actions bisa membuat Release baru

    steps:
      - name: Ambil Kode Repositori
        uses: actions/checkout@v4

      - name: Upload File Zip ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nusa-wallet-chrome.zip
            nusa-wallet-firefox.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
